<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200" role="img" aria-label="Claude Relay (Python): Hands your Claude Code task to Google Antigravity at the 5-hour limit, and back when it resets. Built with Python, CLI, 54 tests, 0 deps.">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a4c"/><stop offset="1" stop-color="#7aa8ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#ff8a4c" stop-opacity="0.22"/><stop offset="1" stop-color="#ff8a4c" stop-opacity="0"/>
    </radialGradient>
    <style>
      .ti { font: 800 27px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #f8fafc; }
      .ds { font: 400 16px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #cbd5e1; }
      .ch { font: 600 13px 'Fira Code', Consolas, Menlo, monospace; fill: #e2e8f0; }
      .lg { font: 600 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #94a3b8; }
      .border { animation: pulse 3.5s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { stroke-opacity: .35; } 50% { stroke-opacity: .9; } }
      .in { opacity: 0; animation: in .7s ease-out forwards; }
      @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>
  <rect x="1" y="1" width="578" height="198" rx="16" fill="#0b1020"/>
  <rect x="1" y="1" width="578" height="198" rx="16" fill="url(#glow)"/>
  <rect x="1" y="1" width="578" height="198" rx="16" fill="none" stroke="url(#accent)" stroke-width="2" class="border"/>
  <rect x="24" y="22" width="56" height="5" rx="2.5" fill="url(#accent)"/>
  <g class="in">
    <text x="24" y="62" class="ti">Claude Relay</text>
    <circle cx="226" cy="54" r="6" fill="#3572A5"/><text x="238" y="59" class="lg">Python</text>
    <text x="24" y="94" class="ds">Hands your Claude Code task to Google Antigravity</text>
    <text x="24" y="116" class="ds">at the 5-hour limit, and back when it resets.</text>
  </g>
  <g class="in" style="animation-delay:.25s"><rect x="24" y="138" width="68" height="28" rx="14" fill="#111a33" stroke="#334155"/><text x="58" y="157" text-anchor="middle" class="ch">Python</text><rect x="100" y="138" width="43" height="28" rx="14" fill="#111a33" stroke="#334155"/><text x="122" y="157" text-anchor="middle" class="ch">CLI</text><rect x="152" y="138" width="85" height="28" rx="14" fill="#111a33" stroke="#334155"/><text x="194" y="157" text-anchor="middle" class="ch">54 tests</text><rect x="245" y="138" width="68" height="28" rx="14" fill="#111a33" stroke="#334155"/><text x="279" y="157" text-anchor="middle" class="ch">0 deps</text></g>
  <text x="556" y="184" text-anchor="end" class="lg">Windows · macOS · Linux</text>
</svg>
