<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200" role="img" aria-label="CryptoPredict AI (Python): Bitcoin price prediction and market direction with XGBoost and Random Forest, plus Streamlit dashboards. Built with XGBoost, scikit-learn, Streamlit, Time series.">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6c177"/><stop offset="1" stop-color="#ff3d9a"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#f6c177" stop-opacity="0.22"/><stop offset="1" stop-color="#f6c177" stop-opacity="0"/>
    </radialGradient>
    <style>
      .ti { font: 800 27px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #f8fafc; }
      .ds { font: 400 16px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #cbd5e1; }
      .ch { font: 600 13px 'Fira Code', Consolas, Menlo, monospace; fill: #e2e8f0; }
      .lg { font: 600 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #94a3b8; }
      .border { animation: pulse 3.5s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { stroke-opacity: .35; } 50% { stroke-opacity: .9; } }
      .in { opacity: 0; animation: in .7s ease-out forwards; }
      @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>
  <rect x="1" y="1" width="578" height="198" rx="16" fill="#0b1020"/>
  <rect x="1" y="1" width="578" height="198" rx="16" fill="url(#glow)"/>
  <rect x="1" y="1" width="578" height="198" rx="16" fill="none" stroke="url(#accent)" stroke-width="2" class="border"/>
  <rect x="24" y="22" width="56" height="5" rx="2.5" fill="url(#accent)"/>
  <g class="in">
    <text x="24" y="62" class="ti">CryptoPredict AI</text>
    <circle cx="287" cy="54" r="6" fill="#3572A5"/><text x="299" y="59" class="lg">Python</text>
    <text x="24" y="94" class="ds">Bitcoin price prediction and market direction with</text>
    <text x="24" y="116" class="ds">XGBoost and Random Forest, plus Streamlit dashboards.</text>
  </g>
  <g class="in" style="animation-delay:.25s"><rect x="24" y="138" width="77" height="28" rx="14" fill="#111a33" stroke="#334155"/><text x="62" y="157" text-anchor="middle" class="ch">XGBoost</text><rect x="109" y="138" width="119" height="28" rx="14" fill="#111a33" stroke="#334155"/><text x="168" y="157" text-anchor="middle" class="ch">scikit-learn</text><rect x="236" y="138" width="94" height="28" rx="14" fill="#111a33" stroke="#334155"/><text x="282" y="157" text-anchor="middle" class="ch">Streamlit</text><rect x="337" y="138" width="110" height="28" rx="14" fill="#111a33" stroke="#334155"/><text x="392" y="157" text-anchor="middle" class="ch">Time series</text></g>
  <text x="556" y="184" text-anchor="end" class="lg">ML · technical indicators</text>
</svg>
