<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Krish Hingu: Computer Engineering student, software developer, AI and ML builder, Mumbai">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.5" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#120a24"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff3d9a"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.35 0;0.35 0;-0.35 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7928CA" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7928CA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00F0FF" stroke-opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="400" rx="24"/></clipPath>
    <style>
      .hi   { font: 600 22px 'Fira Code', Consolas, Menlo, monospace; fill: #7dd3fc; }
      .name { font: 800 88px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; }
      .role { font: 500 23px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #cbd5e1; }
      .chip { font: 600 15px 'Fira Code', Consolas, Menlo, monospace; fill: #e2e8f0; }
      .loc  { font: 500 16px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #94a3b8; }
      .drift1 { animation: d1 14s ease-in-out infinite; }
      .drift2 { animation: d2 18s ease-in-out infinite; }
      @keyframes d1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(90px,40px); } }
      @keyframes d2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-110px,-30px); } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .rise { opacity: 0; animation: rise .9s ease-out forwards; }
      .r2 { animation-delay: .25s; } .r3 { animation-delay: .5s; } .r4 { animation-delay: .75s; }
      @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      .float1 { animation: f 4s ease-in-out infinite; }
      .float2 { animation: f 4s 1s ease-in-out infinite; }
      .float3 { animation: f 4s 2s ease-in-out infinite; }
      .float4 { animation: f 4s 3s ease-in-out infinite; }
      @keyframes f { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      .scan { animation: scan 6s linear infinite; }
      @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(440px); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <circle cx="260" cy="120" r="260" fill="url(#blobA)" class="drift1"/>
    <circle cx="980" cy="300" r="300" fill="url(#blobB)" class="drift2"/>
    <rect x="0" y="0" width="1200" height="2" fill="#00F0FF" fill-opacity="0.18" class="scan"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="24" fill="none" stroke="#00F0FF" stroke-opacity="0.25"/>

  <!-- left: identity -->
  <g class="rise"><text x="70" y="110" class="hi">&gt; hello_world.py — Hi there, I'm<tspan class="cursor" fill="#00F0FF"> ▌</tspan></text></g>
  <g class="rise r2"><text x="64" y="205" class="name" fill="url(#name)" filter="url(#glow)">Krish Hingu</text></g>
  <g class="rise r3"><text x="70" y="255" class="role">Computer Engineering Student · Software Developer · AI &amp; ML Builder</text></g>
  <g class="rise r4">
    <circle cx="78" cy="300" r="5" fill="#3ECF8E"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="92" y="306" class="loc">Mumbai, India · building PulseOS, TradeVision AI &amp; Claude Relay</text>
  </g>

  <!-- right: floating stack chips -->
  <g class="float1"><rect x="880" y="70" width="140" height="40" rx="20" fill="#0f172a" stroke="#00F0FF" stroke-opacity=".7"/><text x="950" y="96" text-anchor="middle" class="chip">Python</text></g>
  <g class="float2"><rect x="1035" y="120" width="125" height="40" rx="20" fill="#0f172a" stroke="#8b5cf6" stroke-opacity=".8"/><text x="1097" y="146" text-anchor="middle" class="chip">Flutter</text></g>
  <g class="float3"><rect x="905" y="135" width="120" height="40" rx="20" fill="#0f172a" stroke="#ff3d9a" stroke-opacity=".7"/><text x="965" y="161" text-anchor="middle" class="chip">FastAPI</text></g>
  <g class="float4"><rect x="1020" y="185" width="140" height="40" rx="20" fill="#0f172a" stroke="#3ECF8E" stroke-opacity=".7"/><text x="1090" y="211" text-anchor="middle" class="chip">Next.js</text></g>
  <g class="float2"><rect x="900" y="200" width="105" height="40" rx="20" fill="#0f172a" stroke="#f6c177" stroke-opacity=".7"/><text x="952" y="226" text-anchor="middle" class="chip">AI/ML</text></g>
</svg>
