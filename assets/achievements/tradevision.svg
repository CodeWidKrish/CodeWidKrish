<svg xmlns="http://www.w3.org/2000/svg" width="390" height="250" viewBox="0 0 390 250" role="img" aria-label="TradeVision AI: Lead architect. Capstone stock-intelligence app: Flutter UI + FastAPI backend">
  <defs>
    <radialGradient id="gl" cx=".5" cy=".28" r=".5"><stop offset="0" stop-color="#FF3D9A" stop-opacity=".35"/><stop offset="1" stop-color="#FF3D9A" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect x="1" y="1" width="388" height="248" rx="20"/></clipPath>
    <style>
      .bob { animation: bob 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes bob { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.06); } }
      .i { font: 48px 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
      .t { font: 800 25px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #f8fafc; }
      .k { font: 700 13px 'Fira Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace; fill: #FF3D9A; letter-spacing: 1.5px; }
      .l { font: 400 15px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #cbd5e1; }
    </style>
  </defs>
  <rect x="1" y="1" width="388" height="248" rx="20" fill="#0b1020" stroke="#FF3D9A" stroke-opacity=".7" stroke-width="2"/>
  <rect x="1" y="1" width="388" height="248" rx="20" fill="url(#gl)"/>
  <text x="195" y="78" text-anchor="middle" class="i bob">📈</text>
  <text x="195" y="124" text-anchor="middle" class="t">TradeVision AI</text>
  <text x="195" y="150" text-anchor="middle" class="k">LEAD ARCHITECT</text>
  <text x="195" y="190" text-anchor="middle" class="l">Capstone stock-intelligence app:</text>
  <text x="195" y="212" text-anchor="middle" class="l">Flutter UI + FastAPI backend</text>
</svg>
